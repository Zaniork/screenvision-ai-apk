name: Build Android APK (ScreenVision AI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug ou release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies & Vite
        run: |
          npm install --include=dev
          npx vite --version || npm install -D vite @vitejs/plugin-react @tailwindcss/vite

      - name: Compile Web Application (Vite)
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ScreenVision AI" "com.screenvision.ai" --web-dir "dist"
          npx cap add android || echo "Android folder already exists"
          npx cap sync android

      - name: Build Android Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type != 'release' }}"
        uses: actions/upload-artifact@v4
        with:
          name: screenvision-ai-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release' }}"
        uses: actions/upload-artifact@v4
        with:
          name: screenvision-ai-release-unsigned.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
